location = /drakon {
    return 301 /drakon/;
}

location = /drakon-tech {
    return 301 /drakon-tech/;
}

location /drakon-tech/ {
    auth_basic "DRAKON test";
    auth_basic_user_file /etc/nginx/.drakon-web.htpasswd;

    proxy_pass http://127.0.0.1:13339/tech/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location = /workflow {
    return 301 /workflow/;
}

location /workflow/ {
    auth_basic "DRAKON test";
    auth_basic_user_file /etc/nginx/.drakon-web.htpasswd;

    proxy_pass http://127.0.0.1:13339/workflow/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location /drakon/ {
    auth_basic "DRAKON test";
    auth_basic_user_file /etc/nginx/.drakon-web.htpasswd;

    proxy_pass http://127.0.0.1:13339/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
